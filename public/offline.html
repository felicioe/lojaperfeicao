<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SGLFM</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #f1f5f9;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      .glyph {
        font-size: 40px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        margin-top: 16px;
        background: #f1f5f9;
        color: #0f172a;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glyph">⚜</div>
      <h1>Sem conexão com a internet</h1>
      <p>
        Não foi possível carregar esta página. Verifique sua conexão e tente novamente — dados já
        visitados recentemente podem continuar disponíveis.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
